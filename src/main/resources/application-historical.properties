# ==============================================================================
# Perfil historical — ARE (Arequipa RescUE)
# Operación normal sobre base histórica protegida (arequipa_rescue):
# - Deshabilita migraciones automáticas de Flyway.
# - Mantiene validación estricta del esquema mediante Hibernate (validate).
# - Requiere definir ARE_DB_URL explícitamente en el entorno.
# ==============================================================================

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
