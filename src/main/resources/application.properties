# ==============================================================================
# ARE — Arequipa RescUE (Incremento 01)
# Configuración base: Spring Boot 3.4.5, MySQL 8.4 LTS (InnoDB) y Flyway
# Referencias: DEC-005, DEC-020 (ADR-0001), DEC-021 (ADR-0002)
# ==============================================================================

spring.application.name=arequipa-rescue
server.port=${ARE_SERVER_PORT:8080}

# Datasource MySQL 8.4 LTS (URL explícita obligatoria; credenciales inyectadas por entorno sin secretos en Git)
spring.datasource.url=${ARE_DB_URL:}
spring.datasource.username=${ARE_DB_USERNAME:are_user}
spring.datasource.password=${ARE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (validación estricta del esquema gestionado por Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
