<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — ARE (Arequipa RescUE)'">ARE — Arequipa RescUE</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/are-design-system.css}">
</head>
<body>

<div th:fragment="appShell(pageTitle, pageSubtitle, activeSection, content)" class="are-shell">
    <a class="are-skip-link" href="#main-content">Saltar al contenido principal</a>

    <!-- Persistent desktop sidebar -->
    <aside class="are-sidebar d-none d-lg-flex">
        <div th:replace="~{fragments/navigation :: sidebarNav(${activeSection})}"></div>
    </aside>

    <!-- Mobile / tablet offcanvas sidebar -->
    <div class="offcanvas offcanvas-start are-sidebar-offcanvas d-lg-none"
         tabindex="-1"
         id="areMobileSidebar"
         aria-labelledby="areMobileSidebarLabel">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
            <span class="fw-bold text-white" id="areMobileSidebarLabel">ARE — Menú operativo</span>
            <button type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar menú de navegación"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div th:replace="~{fragments/navigation :: sidebarNav(${activeSection})}"></div>
        </div>
    </div>

    <div class="are-content-column">
        <header class="are-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-are-outline btn-sm d-lg-none d-inline-flex align-items-center gap-1"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#areMobileSidebar"
                        aria-controls="areMobileSidebar"
                        aria-label="Abrir menú de navegación">
                    <i data-lucide="menu" class="are-nav-icon" aria-hidden="true"></i>
                    <span>Menú</span>
                </button>
                <div>
                    <h1 class="are-topbar-title" th:text="${pageTitle}">ARE — Arequipa RescUE</h1>
                    <p th:if="${pageSubtitle != null}" class="are-topbar-subtitle" th:text="${pageSubtitle}">
                        Panel de coordinación de emergencias médicas
                    </p>
                </div>
            </div>
            <div class="d-none d-sm-flex align-items-center gap-2">
                <span th:replace="~{fragments/components :: statusBadge('Simulador académico', 'navy')}"></span>
            </div>
        </header>

        <main id="main-content" class="are-main" tabindex="-1">
            <div th:replace="~{fragments/components :: flashAlerts}"></div>
            <div th:insert="${content}"></div>
        </main>

        <footer class="are-footer">
            Proyecto académico de ingeniería de software. Exclusivamente para simulación y experimentación académica (DEC-001).
        </footer>
    </div>

    <script th:src="@{/vendor/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/lucide/0.469.0/lucide.min.js}"></script>
    <script th:src="@{/js/are-ui.js}"></script>
</div>

</body>
</html>
